name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build the release from (for example v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tag must match the package version
        run: |
          version=$(grep -m1 '"version"' package.json | cut -d'"' -f4)
          [ "${TAG}" = "v${version}" ] || { echo "tag ${TAG} does not match version ${version}"; exit 1; }
      - run: npm run check
      - run: node tools/package-web.mjs
      - name: Create the GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const release = require('./.github/scripts/release.cjs');
            const url = await release({
              github,
              context,
              tag: '${{ env.TAG }}',
              zipPath: 'dist/rup-flow-skill.zip',
              changelogPath: 'CHANGELOG.md',
            });
            core.info(`Published ${url}`);
