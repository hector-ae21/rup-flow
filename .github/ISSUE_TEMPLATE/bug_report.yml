name: Bug report
description: Something in the skill, the CLI or the templates does not work
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options: [Claude Code, Claude on the web, CLI used by hand, Docker or PlantUML rendering, Documentation]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps or prompt to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node version, Docker version, rup-flow version
